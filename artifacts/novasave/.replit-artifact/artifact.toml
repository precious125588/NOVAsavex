kind = "web"
previewPath = "/"
title = "NovaSave"
version = "1.0.0"
id = "artifacts/novasave"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19052

[services.development]
run = "pnpm --filter @workspace/novasave run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/novasave", "run", "build" ]
publicDir = "artifacts/novasave/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19052"
BASE_PATH = "/"
